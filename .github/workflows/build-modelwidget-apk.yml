name: Build ModelWidget APK

on:
  push:
    branches: [ main, modelwidget-build ]
    paths:
      - 'ModelWidget/**'
      - 'app/src/main/assets/html_parts/**'
      - '.github/workflows/build-modelwidget-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Package and improve model framing in the offline 3D viewer
        run: |
          mkdir -p ModelWidget/app/src/main/assets
          cat app/src/main/assets/html_parts/part-*.txt > ModelWidget/app/src/main/assets/index.html
          python3 - <<'PY'
          from pathlib import Path
          path = Path("ModelWidget/app/src/main/assets/index.html")
          html = path.read_text()
          new = """function DA(){
            if(!h.current||!E.current||!o.current)return;
            h.current.updateWorldMatrix(true,true);
            h.current.traverse(node=>{
              if(node.isMesh&&node.geometry){
                node.visible=true;
                if(!node.geometry.boundingBox)node.geometry.computeBoundingBox();
              }
            });
            const box=new WQ().setFromObject(h.current);
            if(box.isEmpty()){
              console.warn("Model loaded, but its visible geometry bounds are empty.");
              x("Model loaded, but no visible geometry bounds were found.");
              return;
            }
            const center=box.getCenter(new CA),size=box.getSize(new CA);
            const radius=Math.max(size.length()*0.5,1e-6);
            const camera=E.current,controls=o.current;
            const verticalFov=(camera.fov||50)*Math.PI/180;
            const aspect=Math.max(camera.aspect||1,0.1);
            const horizontalFov=2*Math.atan(Math.tan(verticalFov/2)*aspect);
            const fitFov=Math.max(0.05,Math.min(verticalFov,horizontalFov));
            const distance=Math.max(radius/Math.sin(fitFov/2)*1.3,radius*2.2,1e-4);
            camera.near=Math.max(radius/1000,1e-7);
            camera.far=Math.max(distance+radius*30,1);
            camera.position.set(center.x+distance*0.25,center.y+distance*0.18,center.z+distance);
            controls.target.copy(center);
            controls.minDistance=Math.max(radius*0.001,1e-7);
            controls.maxDistance=Math.max(distance*100,1);
            camera.updateProjectionMatrix();
            controls.update();
            camera.lookAt(center);
          }"""
          helper = """function ensureModelRenderable(root){
            if(!root)return;
            root.visible=true;
            root.traverse(node=>{
              node.visible=true;
              if(!node.isMesh)return;
              node.frustumCulled=false;
              node.renderOrder=1;
              if(!node.material)node.material=new Pe({color:"#d1d5db",roughness:.8,side:2});
              const materials=Array.isArray(node.material)?node.material:[node.material];
              materials.forEach(material=>{
                if(!material)return;
                material.visible=true;
                material.side=2;
                material.depthTest=true;
                material.depthWrite=true;
                if(!Number.isFinite(material.opacity)||material.opacity<=0.01){
                  material.opacity=1;
                  material.transparent=false;
                }
                material.needsUpdate=true;
              });
            });
            root.updateWorldMatrix(true,true);
          }
          """
          start = html.index("function DA(){")
          end = html.index("function XA(", start)
          html = html[:start] + new + html[end:]
          html = html.replace("function DA(){", helper + "function DA(){", 1)
          load_marker = "h.current=tI,Q.current?.add(tI);const eI=bA(tI);"
          if load_marker not in html:
              raise SystemExit("Could not find model attachment code; refusing to build an unpatched APK")
          html = html.replace(load_marker, "h.current=tI,Q.current?.add(tI);ensureModelRenderable(tI);const eI=bA(tI);", 1)
          path.write_text(html)
          PY
          test -s ModelWidget/app/src/main/assets/index.html
          grep -q 'visible geometry bounds' ModelWidget/app/src/main/assets/index.html
          grep -q 'ensureModelRenderable(tI)' ModelWidget/app/src/main/assets/index.html
      - name: Build debug APK
        working-directory: ModelWidget
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ModelWidget-Multiformat-debug-APK
          path: ModelWidget/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
