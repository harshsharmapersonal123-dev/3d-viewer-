name: Build ModelWidget APK

on:
  push:
    branches: [ main, modelwidget-build ]
    paths:
      - 'ModelWidget/**'
      - 'app/src/main/assets/html_parts/**'
      - '.github/workflows/build-modelwidget-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Package the complete offline 3D viewer
        run: |
          mkdir -p ModelWidget/app/src/main/assets
          cat app/src/main/assets/html_parts/part-*.txt > ModelWidget/app/src/main/assets/index.html
          test -s ModelWidget/app/src/main/assets/index.html
      - name: Build debug APK
        working-directory: ModelWidget
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ModelWidget-Multiformat-debug-APK
          path: ModelWidget/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
