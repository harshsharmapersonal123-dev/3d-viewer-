name: Build Live2D Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-android.yml"
      - "Live2D_SDK_part_1.bin"
      - "Live2D_SDK_part_2.bin"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Reassemble original SDK archive
        run: |
          curl -fL "https://raw.githubusercontent.com/harshsharmapersonal123-dev/3d-viewer-/main/Live2D_SDK_part_1.bin" -o part1.bin
          curl -fL "https://raw.githubusercontent.com/harshsharmapersonal123-dev/3d-viewer-/main/Live2D_SDK_part_2.bin" -o part2.bin
          cat part1.bin part2.bin > CubismSdkForNative-5-r.5.zip
          unzip -t CubismSdkForNative-5-r.5.zip
          unzip -q CubismSdkForNative-5-r.5.zip -d sdk

      - name: Build Android debug APK
        working-directory: sdk/CubismSdkForNative-5-r.5/Samples/OpenGL/Demo/proj.android.cmake/Full
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Live2D-Demo-debug-APK
          path: sdk/CubismSdkForNative-5-r.5/Samples/OpenGL/Demo/proj.android.cmake/Full/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
